<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850">
  <style>
    .node { rx: 8; ry: 8; stroke-width: 1.5; }
    .node-text { font-family: sans-serif; font-size: 15px; text-anchor: middle; dominant-baseline: middle; }
    .title-text { font-weight: bold; font-size: 17px; }
    .col-header { font-family: sans-serif; font-size: 16px; fill: #666; text-anchor: middle; }
    .arrow { stroke: #888; stroke-width: 1.5; fill: none; }
    .dashed-arrow { stroke: #aaa; stroke-width: 1.5; stroke-dasharray: 6,4; fill: none; }
    .write-arrow { stroke: #a04040; stroke-width: 1.5; fill: none; }
    .label-text { font-family: sans-serif; font-size: 14px; fill: #555; }
    .marker-text { font-family: sans-serif; font-size: 13px; fill: #777; font-style: italic;}
  </style>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888" />
    </marker>
    <marker id="arrowhead-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#aaa" />
    </marker>
    <marker id="arrowhead-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a04040" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="white" />

  <text x="200" y="30" class="col-header">生成流水线</text>
  <text x="580" y="30" class="col-header">修正存储 (Correction store)</text>
  <text x="860" y="30" class="col-header">专家编辑 (Expert edit)</text>
  <line x1="380" y1="10" x2="380" y2="830" stroke="#eee" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="730" y1="10" x2="730" y2="830" stroke="#eee" stroke-width="2" stroke-dasharray="5,5"/>

  <g transform="translate(40, 60)">
    <rect width="280" height="70" class="node" fill="#efedff" stroke="#c1bdf2"/>
    <text x="140" y="25" class="node-text title-text" fill="#5b4db3">LLM#1</text>
    <text x="140" y="50" class="node-text" fill="#5b4db3">提取故障元素</text>
    <line x1="140" y1="70" x2="140" y2="130" class="arrow" marker-end="url(#arrowhead)" />

    <rect x="0" y="130" width="280" height="70" class="node" fill="#efedff" stroke="#c1bdf2"/>
    <text x="140" y="155" class="node-text title-text" fill="#5b4db3">LLM#2</text>
    <text x="140" y="180" class="node-text" fill="#5b4db3">生成草图树</text>
    <line x1="140" y1="200" x2="140" y2="260" class="arrow" marker-end="url(#arrowhead)" />

    <rect x="0" y="260" width="280" height="60" class="node" fill="#f2f0e8" stroke="#d9d2c2"/>
    <text x="140" y="290" class="node-text" fill="#5d5746">结构校验</text>
    <line x1="140" y1="320" x2="140" y2="380" class="arrow" marker-end="url(#arrowhead)" />

    <rect x="0" y="380" width="280" height="70" class="node" fill="#fdf1e1" stroke="#dfc29f"/>
    <text x="140" y="405" class="node-text title-text" fill="#9e5b22">节点级检索</text>
    <text x="140" y="430" class="node-text" fill="#9e5b22">$in 查询，加权排序</text>
    <line x1="140" y1="450" x2="140" y2="510" class="arrow" marker-end="url(#arrowhead)" />

    <rect x="0" y="510" width="280" height="70" class="node" fill="#e6f2ec" stroke="#99c7ad"/>
    <text x="140" y="535" class="node-text title-text" fill="#1f6b45">LLM#3</text>
    <text x="140" y="560" class="node-text" fill="#1f6b45">针对性修复阶段</text>
    <line x1="140" y1="580" x2="140" y2="640" class="arrow" marker-end="url(#arrowhead)" />

    <rect x="0" y="640" width="280" height="60" class="node" fill="#f2f0e8" stroke="#d9d2c2"/>
    <text x="140" y="670" class="node-text" fill="#5d5746">语义校验</text>
    <line x1="140" y1="700" x2="140" y2="760" class="arrow" marker-end="url(#arrowhead)" />

    <rect x="0" y="760" width="280" height="60" class="node" fill="#e6f2ec" stroke="#99c7ad"/>
    <text x="140" y="790" class="node-text" fill="#1f6b45">最终树输出</text>
  </g>

  <g transform="translate(410, 180)">
    <rect width="280" height="70" class="node" fill="#fdf1e1" stroke="#dfc29f"/>
    <text x="140" y="30" class="node-text title-text" fill="#9e5b22">corrections_col</text>
    <text x="140" y="55" class="node-text" fill="#9e5b22">每个修正对应一个文档</text>

    <rect x="30" y="90" width="220" height="40" class="node" rx="4" ry="4" fill="#fdf1e1" stroke="#dfc29f"/>
    <text x="140" y="110" class="node-text" fill="#9e5b22" font-size="14px">基于 node_name 建立索引</text>
    <line x1="140" y1="130" x2="140" y2="210" class="dashed-arrow" marker-end="url(#arrowhead-dashed)" style="stroke:#c07070;stroke-dasharray:none;" />

    <rect x="0" y="380" width="280" height="70" class="node" fill="#fcedea" stroke="#dfada6"/>
    <text x="140" y="405" class="node-text title-text" fill="#a13f35">diff_analyzer.py</text>
    <text x="140" y="430" class="node-text" fill="#a13f35">对比 AI 与专家树的差异</text>
    <line x1="140" y1="380" x2="140" y2="250" class="write-arrow" marker-end="url(#arrowhead-write)" />
    <text x="160" y="300" class="label-text" fill="#a04040">写入</text>
  </g>

  <g transform="translate(760, 560)">
    <rect width="200" height="70" class="node" fill="#f2f0e8" stroke="#d9d2c2"/>
    <text x="100" y="25" class="node-text title-text" fill="#5d5746">专家编辑</text>
    <text x="100" y="50" class="node-text" fill="#5d5746">保存新版本</text>
    <line x1="0" y1="35" x2="-70" y2="35" class="arrow" marker-end="url(#arrowhead)" />
  </g>

  <g transform="translate(410, 680)">
    <rect width="530" height="140" class="node" fill="white" stroke="#e0e0e0"/>
    <text x="265" y="25" class="node-text" font-weight="bold" font-size="16px" fill="#333">相比 v1 版本的变化</text>
    
    <g transform="translate(20, 50)">
      <rect width="160" height="40" class="node" fill="#fdf1e1" stroke="#dfc29f"/>
      <text x="80" y="20" class="node-text" fill="#9e5b22">节点级 $in 查询</text>
    </g>
    <g transform="translate(190, 50)">
      <rect width="160" height="40" class="node" fill="#e6f2ec" stroke="#99c7ad"/>
      <text x="80" y="20" class="node-text" fill="#1f6b45">针对性修复</text>
    </g>
    <g transform="translate(360, 50)">
      <rect width="160" height="40" class="node" fill="#fcedea" stroke="#dfada6"/>
      <text x="80" y="20" class="node-text" fill="#a13f35">基于文档的存储</text>
    </g>

    <text x="265" y="115" class="node-text" fill="#777" font-size="14px">加权排序依据：名称 +3, 类型 +2, 高价值 +1, 时效性 +0-1</text>
  </g>

  <path d="M 40 165 C -10 165, -10 100, 30 100" class="dashed-arrow" marker-end="url(#arrowhead-dashed)"/>
  <text x="15" y="140" class="marker-text">尝试</text>

  <path d="M 320 440 C 370 440, 390 310, 410 250" class="dashed-arrow" stroke="#dfc29f" marker-end="url(#arrowhead-dashed)" style="stroke:#b86e2d;" />
  <text x="350" y="380" class="marker-text" fill="#b86e2d">查询</text>

  <path d="M 40 545 C -10 545, -10 420, 30 420" class="dashed-arrow" marker-end="url(#arrowhead-dashed)"/>
  <text x="15" y="520" class="marker-text">反馈</text>

</svg>
